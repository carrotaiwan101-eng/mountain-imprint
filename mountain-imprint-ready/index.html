<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#31533e">
  <title>百岳印記｜Mountain Imprint</title>
  <style>
    :root {
      --forest: #31533e;
      --deep-forest: #173728;
      --paper: #fbf8ef;
      --gold: #b08c4e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--forest);
      font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
      background-color: #dbe7d1;
      background-image: url("assets/facebook-background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    main {
      width: min(92vw, 440px);
      padding: 26px 24px 30px;
      text-align: center;
      border: 1px solid rgba(49, 83, 62, .55);
      border-radius: 28px;
      background: rgba(251, 248, 239, .96);
      box-shadow: 0 20px 50px rgba(23, 55, 40, .17);
    }

    .logo {
      display: block;
      width: min(100%, 310px);
      margin: 0 auto 20px;
      border-radius: 14px;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border-radius: 10px;
      color: var(--paper);
      text-decoration: none;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      transition: transform .18s ease, background .18s ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      outline: 3px solid rgba(176, 140, 78, .45);
      outline-offset: 3px;
    }

    .facebook { background: #527c5d; }
    .instagram { background: #123c2a; }
    .facebook:hover,
    .facebook:focus-visible { background: #638d6d; }
    .instagram:hover,
    .instagram:focus-visible { background: #1c5039; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="correct%20Logo.png" alt="百岳印記 Mountain Imprint 正式標誌">
    <nav aria-label="社群連結">
      <a class="facebook"
         href="https://www.facebook.com/share/1HUK9UdDZ5/?mibextid=wwXIfr"
         target="_blank"
         rel="noopener noreferrer">Facebook</a>
      <a class="instagram"
         href="https://www.instagram.com/mountain_imprint?igsh=aXo4cW56eGlheDQx&utm_source=qr"
         target="_blank"
         rel="noopener noreferrer">Instagram</a>
    </nav>
  </main>
</body>
</html>
