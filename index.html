<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#31533e">
    <title>百岳印記｜Mountain Imprint</title>
    <style>
      :root {
        --forest: #31533e;
        --deep-forest: #173728;
        --moss: #9aab8c;
        --paper: #fbf8ef;
        --gold: #b08c4e;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        color: var(--forest);
        font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
        background:
          repeating-radial-gradient(ellipse at 50% 18%, transparent 0 34px, rgba(49, 83, 62, .1) 35px 36px, transparent 37px 62px),
          linear-gradient(145deg, #e8efdc, #b7cab4);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        bottom: 0;
        display: block;
        content: "";
        pointer-events: none;
      }

      body::before {
        width: 100%;
        height: 31vh;
        opacity: .38;
        background:
          linear-gradient(63deg, transparent 49%, #6f8d72 50%) 0 100% / 126px 190px repeat-x,
          linear-gradient(117deg, transparent 49%, #86a187 50%) 0 100% / 168px 235px repeat-x;
      }

      body::after {
        width: 100%;
        height: 13vh;
        background: linear-gradient(to top, rgba(55, 90, 64, .35), transparent);
      }

      main {
        width: min(92vw, 440px);
        padding: 26px 24px 30px;
        text-align: center;
        border: 1px solid rgba(49, 83, 62, .55);
        border-radius: 28px;
        background: rgba(251, 248, 239, .95);
        box-shadow: 0 20px 50px rgba(23, 55, 40, .17);
      }

      .logo {
        display: block;
        width: min(100%, 310px);
        margin: 0 auto 18px;
        border-radius: 14px;
      }

      h1 {
        margin: 0;
        font-size: 1.45rem;
        letter-spacing: .16em;
      }

      .english {
        margin: 9px 0 20px;
        color: #6f755f;
        font-family: Georgia, serif;
        font-size: .92rem;
        letter-spacing: .13em;
      }

      .tagline {
        margin: 0 0 24px;
        font-size: .95rem;
        letter-spacing: .17em;
      }

      nav { display: grid; gap: 12px; }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        border-radius: 10px;
        color: var(--paper);
        text-decoration: none;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: .04em;
        transition: transform .18s ease, background .18s ease;
      }

      a:hover, a:focus-visible {
        transform: translateY(-2px);
        outline: 3px solid rgba(176, 140, 78, .45);
        outline-offset: 3px;
      }

      .facebook { background: #31533e; }
      .instagram { background: var(--deep-forest); }
      .facebook:hover, .facebook:focus-visible { background: #426d51; }
      .instagram:hover, .instagram:focus-visible { background: #254d38; }

      /* R5：名片內嵌 Facebook 背景資產，避免外部路徑載入失敗。 */
      body {
        background-color: #dbe7d1;
        background-image: url("assets/facebook-background.png");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      body::before,
      body::after {
        display: none;
      }

      main {
        background: var(--paper);
      }

      /* R3：綠色社群按鈕以明確深淺區分。 */
      .facebook { background: #527c5d; }
      .instagram { background: #123c2a; }
      .facebook:hover, .facebook:focus-visible { background: #638d6d; }
      .instagram:hover, .instagram:focus-visible { background: #1c5039; }

    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="../../Logo/final%20Logo/correct%20Logo.png" alt="百岳印記 Mountain Imprint 正式標誌">
      <nav aria-label="社群連結">
        <a class="facebook" href="https://www.facebook.com/share/1HUK9UdDZ5/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a class="instagram" href="https://www.instagram.com/mountain_imprint?igsh=aXo4cW56eGlheDQx&utm_source=qr" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </main>
  </body>
</html>
